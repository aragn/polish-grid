# Builds the app's data model (etl/model.py) and uploads it, with the data files, to the app's private R2 bucket.
# Runs after each data job finishes, and daily as a fallback. Does nothing until the R2 secrets are set
# (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET).

name: Sync app data to R2

on:
  workflow_run:
    workflows: ["Update connection queues", "Update land plots", "Update ENTSO-E data"]
    types: [completed]
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: r2-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests boto3
      - run: python etl/model.py --out model
      - run: python etl/r2_sync.py model pl/model
      - run: python etl/r2_sync.py data pl/data --exclude snapshots
