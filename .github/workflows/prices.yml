# Fetches Poland's day-ahead price (after the auction, about 12:45 Warsaw time)
# and actual generation per type from ENTSO-E, and commits data/prices/ and
# data/generation/; the unit-output page draws the price over the generation
# chart and splits the rest of the system by fuel.  The early run has the
# previous day's generation ready by the time PSE publishes its meter data.
name: Update ENTSO-E data

on:
  schedule:
    - cron: "20 12 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal (last 10 days) or backfill (since June 2024)"
        default: normal

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then flag=--backfill; else flag=; fi
          python etl/prices.py $flag
          python etl/generation.py $flag
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/prices data/generation
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "ENTSO-E prices and generation: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
